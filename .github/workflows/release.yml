name: Release

# Push a tag that matches manifest.json's version (e.g. 0.2.0, no "v") to publish.
on:
    push:
        tags: ["*.*.*"]

permissions:
    contents: write
    id-token: write
    attestations: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci

            - name: Tag must match manifest version
              run: |
                  manifest=$(node -p "require('./manifest.json').version")
                  if [ "$manifest" != "${GITHUB_REF_NAME}" ]; then
                      echo "Tag ${GITHUB_REF_NAME} doesn't match manifest.json version $manifest"
                      exit 1
                  fi

            - run: npm run check
            - run: npm run build

            - name: Attest build provenance
              uses: actions/attest-build-provenance@v2
              with:
                  subject-path: |
                      main.js
                      manifest.json
                      styles.css

            - name: Create GitHub release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh release create "${GITHUB_REF_NAME}" main.js manifest.json styles.css \
                      --title "${GITHUB_REF_NAME}" \
                      --generate-notes
